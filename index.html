<!DOCTYPE html>
<html lang="nl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kravschappen</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kravschappen">
<meta name="theme-color" content="">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  /* ---------- Kleur (alleen donker: bruin en beige) ---------- */
  --bg:#1E1611; --surface:#2A201A; --ink:#F3EADF; --muted:#B3A08E; --line:#3A2E25;
  --merk:#5B3B26; --actief:#6B4A33; --op-kleur:#FBF6EE; --op-kleur-zacht:rgba(251,246,238,.2);
  --primary:#E8D6C2; --primary-ink:#2A1D14; --primary-soft:#3A2C22;
  --accent:#C2594A; --done:#7E6C5E;
  /* ontkoppelen (iets van een lijst, dag of recept halen); zelfde rood als verwijderen, ander icoon */
  --ontkoppel:var(--accent);
  /* veegknoppen: bruin in twee tinten, zodat knoppen naast elkaar te onderscheiden zijn */
  --veeg-open:var(--merk); --wijzig:#8C6E55; --veeg-favoriet:var(--merk);
  /* winkelkleuren; een winkel bewaart de naam van het token ('winkel-1'), niet de kleur */
  --winkel-1:#B06A48; --winkel-2:#8A8550; --winkel-3:#8B78B8; --winkel-4:#5A9585; --winkel-5:#B56A82; --winkel-6:#7D8A97; --winkel-7:#A8873F;
  /* chips: tekst = --c gemengd met --chip-meng; vlak = --c met --chip-vlak dekking */
  --chip-meng:var(--op-kleur); --chip-tint:55%; --chip-vlak:28%;
  /* transparant: waas achter vensters en schaduwen */
  --overlay:rgba(0,0,0,.45); --schaduw:rgba(0,0,0,.45); --schaduw-klein:rgba(0,0,0,.3);
  /* half transparant, zonder blur, glans, rand of schaduw: winkeltabs, weekbalk, ronde knoppen */
  --tint:rgba(243,234,223,.07);
  /* menu rechtsboven: lichte pil, volle cirkel voor de huidige tab */
  --menu-vlak:var(--primary-soft); --tab-actief:var(--ink); --tab-icoon:var(--muted); --tab-icoon-actief:var(--bg);

  /* ---------- Tekst ---------- */
  --font:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-xs:12px; --fs-s:14px; --fs-m:15px; --fs-basis:17px; --fs-l:18px; --fs-xl:24px; --fs-titel:34px;
  --gewicht-naam:500; --gewicht-vet:700; --gewicht-zwaar:800;

  /* ---------- Vorm ---------- */
  --r-s:10px; --r-m:14px; --r-l:18px; --r-xl:24px; --r-rond:999px;
  --schaduw-lijst:0 14px 34px var(--schaduw); --schaduw-sleep:0 12px 30px var(--schaduw);
  --schaduw-knop:0 2px 4px var(--schaduw-klein);
  --waas-s:6px; --waas-m:10px;

  /* ---------- Maten ---------- */
  /* ---------- Ruimte ---------- */
  --ruimte-0:2px;  /* alleen voor fijnafstelling */
  --ruimte-1:4px; --ruimte-2:8px; --ruimte-3:12px; --ruimte-4:16px; --ruimte-5:20px; --ruimte-6:28px;

  /* ---------- Maten ---------- */
  --breedte:560px; --breedte-bevestig:440px; --breedte-code:360px; --rand:var(--ruimte-4);
  --h-s:44px;       /* kleine knop, pil, ronde knop */
  --tik:48px;       /* knoppen, velden, tabs */
  --h-m:54px;       /* rij in een venster of keuzelijst */
  --rij:58px;       /* gewone rij */
  --h-tekstvak:110px;
  --rondje:28px;    /* rondje vooraan een rij */
  --vinkje:24px;    /* het vinkje binnen dat rondje */
  --ico:32px;       /* icoon in een menurij */
  --icoonknop:36px; /* knop binnen een veld */
  --icoon-s:16px; --icoon-m:22px; --icoon-l:28px;
  --veegknop:72px;
  /* actieknop onderin het midden (+, Nieuw, potlood, vinkje) */
  --actie-hoogte:64px; --actie-afstand:var(--ruimte-3);
  /* ruimte onder de inhoud, zodat niets achter de actieknop verdwijnt */
  --actie-ruimte:calc(var(--actie-afstand) + var(--actie-hoogte) + var(--ruimte-6));
  /* menu rechtsboven: plek voor de puntjes links van de cirkel, en het aantal tabs */
  --menu-knop:var(--tik); --menu-puntjes:var(--ruimte-6); --tab-aantal:4;

  /* ---------- Beweging ---------- */
  --duur-snel:.15s; --duur:.2s; --duur-traag:.25s; --duur-lus:1.2s; /* lus: herhalende animatie (skelet) */
  --veer:cubic-bezier(.2,.9,.3,1); --veer-tab:cubic-bezier(.3,1.4,.5,1);

  /* ---------- Lagen ---------- */
  --z-binnen:1; --z-kop:5; --z-keuzelijst:7; --z-tabs:8; --z-label:9; --z-venster:20; --z-boven:30; --z-bevestig:40; --z-code:50;

  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
/* De pagina zelf scrolt nooit; alleen #scroller scrolt. Zo staat de actieknop altijd onderaan
   en blijft hij altijd aanklikbaar, ook bij weinig inhoud of na doorscrollen op iOS. */
html,body{overflow:hidden;overscroll-behavior:none}
/* iOS rekent bij web-apps op het beginscherm soms de statusbalk niet mee in de schermhoogte,
   waardoor alles wat onderaan vastzit iets hoger komt te staan. Daarom is de pagina altijd
   schermhoog plus de statusbalk; omdat hij niet scrolt, heeft dat verder geen gevolgen. */
html{height:calc(100% + env(safe-area-inset-top,0px))}
#scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-gutter:stable;padding-bottom:calc(var(--actie-ruimte) + env(safe-area-inset-bottom,0px))}
body.toetsenbord #scroller{padding-bottom:calc(var(--kb,0px) + var(--ruimte-5))}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font);
  font-size:var(--fs-basis);line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a{color:var(--primary)}
.wrap{max-width:var(--breedte);margin:0 auto;padding:0 var(--rand)}
/* Ruimte boven de kop: de veilige zone plus --ruimte-5, zodat de menuknop vrij staat van de vervaagde statusbalk van Safari (web-app op het beginscherm) */
header.top{position:sticky;top:0;z-index:var(--z-kop);background:var(--bg);padding:calc(var(--ruimte-5) + env(safe-area-inset-top,0px)) 0 var(--ruimte-2)}
body.preview header.top{padding-top:calc(var(--ruimte-6) + var(--ruimte-1) + env(safe-area-inset-top,0px))}
#preview-pill{position:fixed;top:calc(var(--ruimte-1) + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:var(--z-label);background:var(--accent);color:var(--op-kleur);font-size:var(--fs-xs);font-weight:var(--gewicht-zwaar);letter-spacing:.04em;border-radius:var(--r-rond);padding:var(--ruimte-1) var(--ruimte-3);text-align:center;white-space:nowrap;width:max-content}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:var(--ruimte-3);min-height:var(--tik)}
.toprow > div:first-child{flex:1;min-width:0}
#title{overflow-wrap:normal}
/* Acties van de pagina (+, Nieuw, potlood, vinkje): volle crème knop onderin het midden */
#topextra{position:fixed;left:50%;bottom:calc(var(--actie-afstand) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:var(--z-tabs)}
#topextra:empty{display:none}
#topextra > *{background:var(--primary);color:var(--primary-ink)}
#topextra .round{width:var(--actie-hoogte);height:var(--actie-hoogte)}
#topextra .btn{min-height:var(--actie-hoogte);border-radius:var(--r-rond);padding:0 var(--ruimte-6)}
header.top h1{margin:0;font-size:var(--fs-titel);font-weight:var(--gewicht-zwaar);letter-spacing:-0.02em;line-height:1.05}
#headerextra:empty{display:none}
#headerextra .stores{margin-top:var(--ruimte-3)}
#headerextra #add-form{margin:var(--ruimte-2) 0 0}
#add-form[hidden]{display:none}
.toevoeg-knop svg{width:var(--icoon-m);height:var(--icoon-m);transition:transform var(--duur)}
.toevoeg-knop.open svg{transform:rotate(45deg)}
#lijst{padding-top:0}
#headerextra .kopzoek{margin:var(--ruimte-3) 0 0;min-height:var(--tik)}
.bewerk-knop svg{width:var(--icoon-m);height:var(--icoon-m)}
.titel-invoer{display:block;width:calc(100% + var(--ruimte-3) + 1px);margin-left:calc((var(--ruimte-3) + 1px) * -1);font:inherit;color:inherit;letter-spacing:inherit;line-height:1.1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--ruimte-1) var(--ruimte-3);min-height:var(--tik);resize:none;overflow:hidden;font-weight:var(--gewicht-zwaar)}
.titel-invoer:focus{outline:2px solid var(--primary);outline-offset:0}
.kaal-select{display:block;width:100%;border:0;background:transparent;font:inherit;font-size:var(--fs-basis);color:var(--ink);padding:var(--ruimte-3) calc(var(--ruimte-6) + var(--ruimte-3)) var(--ruimte-3) var(--ruimte-4);min-height:var(--h-m);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 54%,calc(100% - 17px) 54%;background-size:5px 5px;background-repeat:no-repeat}
.check.staprij,.check.stapweergave{grid-template-columns:var(--rondje) 1fr var(--rondje);align-items:start;min-height:var(--h-m)}
.check.staprij{grid-template-columns:var(--rondje) 1fr var(--rondje) calc(var(--tik) - var(--ruimte-1) * 2);padding-right:var(--ruimte-2)}
.staprij .greep{margin:calc((var(--rondje) - var(--tik)) / 2) calc(var(--ruimte-1) * -1)}
.check.stapweergave{grid-template-columns:var(--rondje) 1fr}
.staprij .pos,.stapweergave .pos{margin-top:var(--ruimte-0)}
.staptekst{font-size:var(--fs-basis);line-height:1.45;padding-top:var(--ruimte-0);overflow-wrap:anywhere}
.stap-invoer{display:block;width:100%;border:0;background:transparent;font:inherit;font-size:var(--fs-basis);line-height:1.45;color:var(--ink);resize:none;overflow:hidden;padding:var(--ruimte-0) 0;margin:0;outline:none}
.stap-invoer::placeholder{color:var(--muted)}
.staprij:focus-within{background:color-mix(in srgb,var(--primary) 6%,transparent)}
.rb-stap-plus{display:block;width:100%;text-align:left;border-top:1px solid var(--line)}
.rb-stap-plus .pmeta{font-size:var(--fs-basis);margin:0}
.check.bewerkrij{grid-template-columns:var(--rondje) 1fr 104px;min-height:var(--h-m)}
.minrond{width:var(--rondje);height:var(--rondje);border-radius:var(--r-rond);background:var(--ontkoppel);color:var(--op-kleur);display:grid;place-items:center}
.minrond svg{width:var(--icoon-s);height:var(--icoon-s)}
.aantal-invoer{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-s);padding:var(--ruimte-2) var(--ruimte-2);font:inherit;font-size:var(--fs-basis);text-align:right;color:var(--ink)}
.rb-toevoeg .bewerkrij{grid-template-columns:var(--rondje) 1fr}
.rb-toevoeg input{width:100%;border:0;background:transparent;font:inherit;font-size:var(--fs-basis);color:var(--ink);padding:var(--ruimte-2) 0;outline:none}
.rb-toevoeg input::placeholder{color:var(--muted)}
.rb-wrap{position:relative}
.kaal-select:focus{outline:2px solid var(--primary);outline-offset:-2px;border-radius:var(--r-l)}
.check.detailrij{grid-template-columns:1fr auto auto;min-height:var(--h-m)}
.rz-rij{width:100%;text-align:left}
.rz-rij .chevr{justify-self:end;margin-right:var(--ruimte-1)}
.pick[hidden],.koppel-groep[hidden]{display:none}
#koppel-zoek{margin:0 0 var(--ruimte-1)}
#koppel h3.cat:first-child{margin-top:var(--ruimte-3)}
header.top p{margin:var(--ruimte-1) 0 0;color:var(--muted);font-size:var(--fs-m)}
#headerextra #w-tabs{margin-bottom:0}
/* Algemene velden en knoppen */
.field{display:block;width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--ruimte-3) var(--ruimte-3);min-height:var(--tik);-webkit-appearance:none;appearance:none}
.field::placeholder{color:var(--muted)}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 54%,calc(100% - 15px) 54%;background-size:5px 5px;background-repeat:no-repeat;padding-right:calc(var(--ruimte-6) + var(--ruimte-2))}
textarea.field{resize:vertical;min-height:var(--h-tekstvak)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--ruimte-1);background:var(--primary);color:var(--primary-ink);border-radius:var(--r-m);padding:0 var(--ruimte-4);font-weight:var(--gewicht-vet);min-height:var(--tik);white-space:nowrap;text-align:center}
.btn.soft{background:var(--primary-soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.wide{width:100%}
.add{display:flex;gap:var(--ruimte-2);margin:var(--ruimte-3) 0 var(--ruimte-1)}
.add .field{flex:1}
#add-form{position:relative}
.ac-lijst{position:absolute;left:0;right:0;top:calc(100% + var(--ruimte-1));z-index:var(--z-keuzelijst);max-height:calc(100vh - 290px - env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);touch-action:pan-y;box-shadow:var(--schaduw-lijst)}
.ac-item{display:grid;grid-template-columns:auto 1fr auto;gap:var(--ruimte-3);align-items:center;width:100%;padding:0 var(--ruimte-3) 0 0;min-height:var(--h-m);border-top:1px solid var(--line)}
.ac-item:first-child{border-top:0}
.wis-knop{display:flex;align-items:center;justify-content:center;gap:var(--ruimte-2);width:100%;margin-top:var(--ruimte-2);min-height:var(--h-m);border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);color:var(--ontkoppel);font-weight:var(--gewicht-vet);text-align:center}
.wis-knop svg{width:var(--icoon-s);height:var(--icoon-s)}
.wis-knop:active{background:color-mix(in srgb,var(--ontkoppel) 10%,var(--surface))}
.ac-kop{position:sticky;top:0;z-index:var(--z-binnen);display:flex;justify-content:space-between;padding:var(--ruimte-3) var(--ruimte-4) var(--ruimte-1);background:var(--surface);font-size:var(--fs-m);font-weight:var(--gewicht-vet);color:var(--muted);border-top:1px solid var(--line)}
.ac-kop:first-child{border-top:0}
.ac-kop + .ac-item{border-top:0}
#ac .swipe{margin:0}
#ac .swipe > .ac-item{border-top:0;background:var(--surface)}
#ac .swipe + .swipe{border-top:1px solid var(--line)}
#ac .swipe-weg{border-radius:0}
.ac-plus{align-self:stretch;display:grid;place-items:center;padding:0 0 0 var(--ruimte-3)}
.ac-naam{align-self:stretch;display:flex;align-items:center;min-width:0;padding:var(--ruimte-3) 0}
.ac-naam:active{opacity:.6}
.ac-item > .chip,.ac-item > .status{justify-self:end}
/* Rest van de pagina vervaagt zolang de keuzelijst open is */
#stores,#lijst{transition:filter var(--duur),opacity var(--duur)}
body.ac-open #lijst{filter:blur(var(--waas-s));opacity:.45;pointer-events:none}
.ac-item .pname b{font-weight:var(--gewicht-zwaar)}
.ac-item .status{font-size:var(--fs-s);color:var(--muted);white-space:nowrap}
.ac-nieuw{color:var(--primary);font-weight:var(--gewicht-vet)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-l);padding:var(--ruimte-5) var(--ruimte-4);color:var(--muted);margin-top:var(--ruimte-4)}
.empty strong{display:block;color:var(--ink);font-size:var(--fs-l);margin-bottom:var(--ruimte-1)}
.empty .btn{margin-top:var(--ruimte-3)}
/* Vinkje */
.tick{width:var(--vinkje);height:var(--vinkje);border-radius:var(--r-rond);border:2px solid var(--line);display:grid;place-items:center;transition:background var(--duur-snel),border-color var(--duur-snel),transform var(--duur-snel);flex:0 0 var(--vinkje)}
.on .tick{background:var(--primary);border-color:var(--primary)}
.on .tick::after,.item.done .tick::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--primary-ink);border-bottom:2.5px solid var(--primary-ink);transform:translateY(-1px) rotate(-45deg)}
/* Op-de-lijst-knop: plus wordt een tasje, zodat het niet lijkt op afvinken */
.addbtn{width:var(--rondje);height:var(--rondje);border-radius:var(--r-rond);border:2px solid color-mix(in srgb,var(--muted) 55%,transparent);display:grid;place-items:center;color:var(--muted);transition:background-color var(--duur-snel),border-color var(--duur-snel),color var(--duur-snel),transform var(--duur-snel)}
.addbtn svg{grid-area:1/1;width:var(--icoon-s);height:var(--icoon-s)}
.addbtn .bag{display:none}
.on .addbtn{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.on .addbtn .plus{display:none}
.on .addbtn .bag{display:block}
/* Staat op de lijst voor een ander recept: omlijnd tasje */
.elders .addbtn{border-color:var(--primary);color:var(--primary);background:transparent}
.elders .addbtn .plus{display:none}
.elders .addbtn .bag{display:block}
.samen-uitleg{margin:0 var(--ruimte-1) var(--ruimte-4);color:var(--muted);font-size:var(--fs-basis)}
.samen-uitleg b{color:var(--ink)}
.samen-knoppen{display:grid;gap:var(--ruimte-2)}
.samen-knoppen .btn{white-space:normal;text-align:center;padding:var(--ruimte-3) var(--ruimte-4)}
h3.dagkop{align-items:center}
h3.dagkop.leeg{opacity:.75}
.round{width:var(--h-s);height:var(--h-s);border-radius:var(--r-rond);background:var(--tint);display:grid;place-items:center}
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);margin-bottom:var(--ruimte-2);overflow:hidden}
/* Vegen in het weekmenu */
.swipe{position:relative;margin-bottom:var(--ruimte-2);touch-action:pan-y;-webkit-user-select:none;user-select:none}
.swipe .swipe-kaart{position:relative;margin:0;transition:transform var(--duur-traag) var(--veer)}
.swipe{--bw:calc(var(--n,1) * var(--veegknop))}   /* --n = aantal veegknoppen */
.swipe.open .swipe-kaart{transform:translateX(calc(var(--bw) * -1))}
.swipe-acties{position:absolute;inset:0;display:flex;justify-content:flex-end;visibility:hidden}
.swipe.open .swipe-acties,.swipe.bezig .swipe-acties{visibility:visible}
/* Veegknoppen tonen alleen een icoon; de tekst (font-size 0) is er alleen voor de schermlezer */
.swipe-weg,.swipe-wk{width:var(--veegknop);height:100%;color:var(--op-kleur);font-size:0;font-weight:var(--gewicht-vet);display:flex;flex-direction:column;align-items:center;justify-content:center}
.swipe-weg{border-radius:var(--r-l);background:var(--accent)}
.swipe-wk{background:var(--c)}
.swipe-weg svg,.swipe-wk svg{width:var(--icoon-l);height:var(--icoon-l)}
.items .swipe{margin:0}
.items .swipe + .swipe{border-top:1px solid var(--line)}
.items .swipe-weg{border-radius:0}
.items .item{background:var(--surface)}
.swipe > .item{border-top:0}
/* Recepten van één dag samen in één blok, net als de boodschappenlijst */
.dag-groep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-bottom:0}
.dag-groep .swipe{margin:0}
.dag-groep .swipe + .swipe{border-top:1px solid var(--line)}

const API_URL = 'https://script.google.com/macros/s/AKfycbw5coGQ3021Tyjm19Ky7-_PmYuw36oeaCJwF1Cw_nAy0LzSzvF9JucT8fFY9EuSY6aL/exec';

(function () {
  if (window.google && google.script && google.script.run) return; // draait binnen Apps Script
  if (!API_URL) return;                                            // geen loket: previewmodus
  window.API_MODUS = true;
  const KEY = 'kravschappen-code';
  const code = () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  function vraagCode(melding) {
    if (document.getElementById('code-scherm')) return;
    const toon = () => {
      const w = document.createElement('div');
      w.id = 'code-scherm';
      w.innerHTML = `<form class="code-kaart">
          <img src="icon-180.png" alt="" width="72" height="72">
          <h2>Kravschappen</h2>
          <p>${melding || 'Voer de geheime code in om jullie lijst te openen.'}</p>
          <input class="field" id="code-invoer" type="password" autocomplete="current-password" placeholder="Geheime code" aria-label="Geheime code">
          <button class="btn wide" type="submit">Openen</button>
        </form>`;
      document.body.appendChild(w);
      const inp = w.querySelector('#code-invoer');
      w.querySelector('form').addEventListener('submit', e => {
        e.preventDefault(); e.stopPropagation();
        const v = inp.value.trim(); if (!v) return;
        try { localStorage.setItem(KEY, v); } catch (err) {}
        location.reload();
      }, true);
      inp.focus();
    };
    document.body ? toon() : document.addEventListener('DOMContentLoaded', toon);
  }
  async function roep(actie, args) {
    if (!code()) { vraagCode(); throw new Error('Geen code ingevoerd'); }
    const r = await fetch(API_URL, { method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ sleutel: code(), actie, args }) });
    const d = await r.json();
    if (d.fout === 'sleutel') {
      try { localStorage.removeItem(KEY); } catch (e) {}
      vraagCode('Die code klopt niet. Probeer het opnieuw.');
      throw new Error('Onjuiste code');
    }
    if (d.fout) throw new Error(d.fout);
    return d.data;
  }

  window.google = { script: { get run() {
    let ok = () => {}, fout = () => {};
    const p = new Proxy({}, { get(_, k) {
      if (k === 'withSuccessHandler') return f => { ok = f; return p; };
      if (k === 'withFailureHandler') return f => { fout = f; return p; };
      return (...a) => { roep(k, a).then(ok, fout); };
    } });
    return p;
  } } };
})();

const rcats = () => { const l = [...(D().receptcategorieen || [])].sort((a, b) => (a.id === 'overig') - (b.id === 'overig') || a.positie - b.positie); return l.length ? l : [{ id: 'overig', naam: 'Overig', positie: 1 }]; };
const rcatNaam = id => ((D().receptcategorieen || []).find(c => c.id === id) || { naam: 'Overig' }).naam;
/** Recepten gegroepeerd per receptcategorie, in de volgorde uit Instellingen. */
function perReceptCat(rs) {
  const ids = rcats().map(c => c.id);
  const groepen = [...ids, ...new Set(rs.map(r => r.categorie || 'overig').filter(c => !ids.includes(c)))];
  return groepen.map(c => ({ c, naam: rcatNaam(c), rs: rs.filter(r => (r.categorie || 'overig') === c) })).filter(g => g.rs.length);
}
const cats = () => [...D().categorieen].sort((a, b) => (a.id === 'overig') - (b.id === 'overig') || a.positie - b.positie);
const catNaam = id => (D().categorieen.find(c => c.id === id) || { naam: 'Overig' }).naam;
const prod = id => D().producten.find(p => p.id === id);
const prodOpNaam = n => D().producten.find(p => p.naam.toLowerCase() === String(n).trim().toLowerCase());
const recept = id => D().recepten.find(r => r.id === id);
const winkelVan = p => { const w = winkel(p.lijstWinkel || p.winkel); return w ? w.id : ''; };
const nodig = p => p.opLijst && !p.afgevinkt;
function volgorde(winkelId) {
  const w = winkel(winkelId);
  const alle = cats().map(c => c.id);
  const route = ((w && w.route) || []).filter(id => alle.includes(id));
  return [...route, ...alle.filter(id => !route.includes(id))];
}
function opties(lijst, gekozen) {
  return lijst.map(o => `<option value="${esc(o.id)}"${o.id === gekozen ? ' selected' : ''}>${esc(o.naam)}</option>`).join('');
}

/* Datums */
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const vanIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const kort = d => d.getDate() + ' ' + MAANDEN[d.getMonth()];
function weekDagen() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + S.week * 7);
  return [...Array(7)].map((_, k) => { const x = new Date(d); x.setDate(d.getDate() + k); return x; });
}
function weeknr(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 864e5 + 1) / 7);
}

/* ================= Server en synchronisatie ================= */
window.addEventListener('error', e => { try { melding('Er ging iets mis: ' + (e.message || 'onbekende fout')); } catch (x) {} });
window.addEventListener('unhandledrejection', e => { try { melding('Er ging iets mis: ' + ((e.reason && e.reason.message) || 'onbekende fout')); } catch (x) {} });
/* Snel opstarten: de laatst bekende stand staat op de telefoon. De app toont die meteen
   en haalt op de achtergrond de nieuwste stand op. */
const LOKAAL = 'kravschappen-stand';
function onthoudLokaal(s) { if (!window.API_MODUS) return; try { localStorage.setItem(LOKAAL, JSON.stringify(s)); } catch (e) {} }
function leesLokaal() { if (!window.API_MODUS) return null; try { return JSON.parse(localStorage.getItem(LOKAAL)); } catch (e) { return null; } }
/** Laadstaat bij de allereerste keer openen: grijze vlakken op de plek van de rijen. */
function tekenSkelet() {
  sub('');
  const rij = '<div class="item"><div class="check"><span class="skelet skelet-rond"></span><span class="skelet skelet-tekst"></span></div></div>';
  $('#main').innerHTML = [3, 2].map(n => `<h3 class="cat"><span class="skelet skelet-kop"></span></h3><div class="items">${rij.repeat(n)}</div>`).join('');
}
function laad() {
  if (!S.data) { const l = leesLokaal(); if (l) { S.data = l; wissel(S.tab); } else tekenSkelet(); }
  google.script.run
    .withSuccessHandler(s => { const eerste = !S.data; S.data = s; onthoudLokaal(s); if (eerste) wissel(S.tab); else if (!bezig) teken(); if (!S.omgezet) { S.omgezet = true; zetWinkelkleurenOm(); } })
    .withFailureHandler(e => { if (!S.data) { $('#subtitle').textContent = 'Laden lukte niet: ' + e.message + '. Herlaad de pagina.'; } })
    .getState();
}
function bel(fn, ...args) {
  bezig++; teller++;
  google.script.run
    .withSuccessHandler(s => { bezig--; if (!bezig) { S.data = s; onthoudLokaal(s); teken(); } })
    .withFailureHandler(e => { bezig--; melding('Opslaan lukte niet (' + e.message + '). Gegevens worden opnieuw geladen.'); laad(); })
    [fn](...args);
}
function peil() {
  if (!S.data || bezig || document.visibilityState !== 'visible') return;
  const t = teller;
  google.script.run.withSuccessHandler(s => { if (!bezig && t === teller) { S.data = s; onthoudLokaal(s); teken(); } }).getState();
}

/** Past rijen lokaal meteen aan en slaat ze daarna op. */
function bewaar(tabel, rijen) {
  rijen.forEach(r => {
    const bestaand = D()[tabel].find(x => x.id === r.id);
    if (bestaand) Object.assign(bestaand, r); else D()[tabel].push(Object.assign({}, r));
  });
  teken();
  bel('bewaar', tabel, rijen);
}
function verwijder(tabel, ids) {
  D()[tabel] = D()[tabel].filter(x => !ids.includes(x.id));

  bel('verwijder', tabel, ids);
}

/* Lijst-acties op producten */
const VAN_LIJST = { opLijst: false, afgevinkt: false, lijstHoeveelheid: '', lijstWinkel: '', lijstVoor: '' };
function zetOpLijst(p, hoeveelheid, voor) {
  bewaar('producten', [{ id: p.id, opLijst: true, afgevinkt: false,
    lijstHoeveelheid: hoeveelheid != null ? hoeveelheid : (p.opLijst ? p.lijstHoeveelheid : ''),
    lijstVoor: voor != null ? voor : (p.opLijst ? p.lijstVoor : '') }]);
}
const voorLijst = s => String(s || '').split(', ').map(x => x.trim()).filter(Boolean);
const noem = l => l.length < 2 ? (l[0] || '') : l.slice(0, -1).join(', ') + ' en ' + l[l.length - 1];
function ontleed(v) {
  const m = String(v || '').trim().match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  return m ? { n: parseFloat(m[1].replace(',', '.')), u: m[2].trim().toLowerCase() } : null;
}
const maak = (n, u) => { const g = String(Math.round(n * 100) / 100).replace('.', ','); return u ? g + ' ' + u : g; };
/** Telt twee aantallen op als de eenheid gelijk is ("300 g" + "300 g" = "600 g"), anders "300 g + 2 stuks". */
function telOp(a, b) {
  if (!a) return b || ''; if (!b) return a;
  const x = ontleed(a), y = ontleed(b);
  if (x && y && x.u === y.u) return maak(x.n + y.n, x.u);
  return a + ' + ' + b;
}
/** Trekt b van a af als dat netjes kan; geeft null terug als het niet te berekenen is. */
function trekAf(a, b) {
  if (!b) return a || '';
  const x = ontleed(a), y = ontleed(b);
  if (x && y && x.u === y.u) return x.n - y.n > 0 ? maak(x.n - y.n, x.u) : '';
  const delen = String(a || '').split(' + ');
  const i = delen.indexOf(b);
  if (i >= 0) { delen.splice(i, 1); return delen.join(' + '); }
  return null;
}
/** Venster als een product al op de lijst staat voor een ander recept: zelf kiezen wat er met het aantal gebeurt. */
/** Elk recept op een dag telt apart, zodat twee keer hetzelfde recept in een week twee keer opgeteld kan worden. */
const DAG_AFK = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
const voorLabel = (r, datum) => `${r.naam} (${DAG_AFK[vanIso(datum).getDay()]})`;
/** Leesbare tekst voor op de lijst: "2× wraps met gehakt en pasta pesto met kip". */
function voorTekst(s) {
  const tel = {};
  voorLijst(s).forEach(v => { const n = v.replace(/\s\((ma|di|wo|do|vr|za|zo)\)$/, ''); tel[n] = (tel[n] || 0) + 1; });
  return noem(Object.entries(tel).map(([n, k]) => (k > 1 ? k + '× ' : '') + klein(n)));
}
function openSamen(p, rn, amt, hier) {
  const voor = voorLijst(p.lijstVoor), nu = p.lijstHoeveelheid || '';
  const knoppen = [];
  let uitleg;
  if (!hier) {
    const anderen = voor.length ? ' voor ' + noem(voor) : '';
    uitleg = `Staat al op de lijst${nu ? ': <b>' + esc(nu) + '</b>' : ''}${esc(anderen)}.${amt ? ` ${esc(rn)} heeft <b>${esc(amt)}</b> nodig.` : ''}`;
    const metRecept = rn ? [...voor, rn].join(', ') : p.lijstVoor;
    if (amt) knoppen.push({ k: 'btn', t: `Optellen → ${telOp(nu, amt)}`, f: () => bewaar('producten', [{ id: p.id, lijstHoeveelheid: telOp(nu, amt), lijstVoor: metRecept }]) });
    knoppen.push({ k: 'btn soft', t: nu ? `Zo laten (${nu})` : 'Zo laten', f: () => bewaar('producten', [{ id: p.id, lijstVoor: metRecept }]) });
    knoppen.push({ k: 'btn soft', t: 'Zelf aanpassen', f: () => { bewaar('producten', [{ id: p.id, lijstVoor: metRecept }]); openItem(p.id); } });
  } else {
    const zonder = voor.filter(n => n !== rn).join(', ');
    uitleg = `Staat op de lijst${nu ? ': <b>' + esc(nu) + '</b>' : ''} voor ${esc(noem(voor))}.`;
    const rest = amt ? trekAf(nu, amt) : null;
    if (rest !== null && amt) knoppen.push({ k: 'btn', t: `Aandeel van ${rn} aftrekken → ${rest || 'geen aantal'}`, f: () => bewaar('producten', [{ id: p.id, lijstHoeveelheid: rest, lijstVoor: zonder }]) });
    knoppen.push({ k: 'btn soft', t: `Alleen ${rn} weghalen, aantal blijft`, f: () => bewaar('producten', [{ id: p.id, lijstVoor: zonder }]) });
    knoppen.push({ k: 'btn ontkoppel', t: 'Helemaal van de lijst halen', f: async () => { if (await bevestig(`${p.naam} helemaal van de lijst halen?`, 'Van de lijst halen', 'ontkoppel')) haalVanLijst(p); } });
  }
  openSheet(`<h4>${esc(p.naam)}</h4><p class="samen-uitleg">${uitleg}</p>
    <div class="samen-knoppen">${knoppen.map((k, i) => `<button type="button" class="${k.k} wide" data-keuze="${i}">${esc(k.t)}</button>`).join('')}</div>`);
  $('#sheet-inhoud').onclick = e => {
    const b = e.target.closest('[data-keuze]'); if (!b) return;
    const k = knoppen[Number(b.dataset.keuze)];
    sluitSheet();
    k.f();
  };
}

const breedte = sw => [...$('.swipe-acties', sw).children].reduce((t, b) => t + b.offsetWidth, 0) || 72;
/** Verhoogt of verlaagt het getal vooraan een aantal; de eenheid blijft staan ("2 pakken" -> "3 pakken", "500 g" -> "600 g"). */
function stapAantal(waarde, richting) {
  const v = String(waarde || '').trim();
  if (!v) return richting > 0 ? '1' : '';
  const m = v.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  const n = m ? parseFloat(m[1].replace(',', '.')) : 1;
  const eenheid = m ? m[2] : v;
  const stap = /^(g|gr|gram|ml)$/i.test(eenheid) && n >= 100 ? 100 : 1;
  const nieuw = Math.round((n + richting * stap) * 100) / 100;
  if (nieuw <= 0) return '';
  const getal = String(nieuw).replace('.', ',');
  return eenheid ? getal + ' ' + eenheid : getal;
}
/** Venster om een product op de lijst aan te passen: aantal en winkel in een keer. */

    ${winkels().length > 1 ? `<h3 class="cat"><span>Winkel</span></h3>
    <div class="stores item-winkels">${winkels().map(w => `<button type="button" class="storetab${w.id === gekozenWinkel ? ' active' : ''}" style="--c:${kleurVan(w)}" data-winkel="${esc(w.id)}">${esc(w.naam)}</button>`).join('')}</div>` : ''}`);
  const inp = $('#aantal-val');

  inp.oninput = () => { markeer(); clearTimeout(typTimer); typTimer = setTimeout(opslaan, 500); };

const ADD_KNOP = '<span class="addbtn" aria-hidden="true">' + ico('plus', 'class="plus"') + ico('tas', 'class="bag"') + '</span>';
const PRUL_ICON = ico('prullenbak');

function sluitVeeg() {

/* Toetsenbord op iOS: de pagina zelf scrolt niet (zie #scroller), dus iOS schuift velden niet vanzelf in beeld.

   en een veld in de pagina wordt in beeld gescrold. */
function pasToetsenbordAan() {
  const vv = window.visualViewport; if (!vv) return;
  const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  document.documentElement.style.setProperty('--kb', kb + 'px');

function houdInBeeld() {
  const el = document.activeElement, vv = window.visualViewport, sc = $('#scroller');
  if (!vv || !el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || !sc.contains(el)) return;
  const r = el.getBoundingClientRect();
  const boven = Math.max($('header.top').getBoundingClientRect().bottom, vv.offsetTop) + 8;
  const onder = vv.offsetTop + vv.height - 16;
  if (r.bottom > onder) sc.scrollBy(0, Math.min(r.bottom - onder, r.top - boven));
  else if (r.top < boven) sc.scrollBy(0, r.top - boven);
}

/* ---------- Winkelroute: afdelingen verslepen ---------- */
let sleep = null;
// Werkt voor elke lijst met data-sorteer: de winkelroute, de categorieën en de receptcategorieën
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('.greep'); if (!g) return;
  const el = g.closest('[data-sid]'), lijst = el && el.parentElement;
  if (!lijst || !lijst.dataset.sorteer) return;
  e.preventDefault(); e.stopPropagation();
  const r = el.getBoundingClientRect();
  const plek = document.createElement(el.tagName); plek.className = 'plek'; plek.style.height = r.height + 'px';
  lijst.insertBefore(plek, el.nextSibling);
  Object.assign(el.style, { top: r.top + 'px', left: r.left + 'px', width: r.width + 'px' });
  el.classList.add('sleept');
  sleep = { el, lijst, plek, dy: e.clientY - r.top, id: e.pointerId, y: e.clientY };
  S.slepen = true;
  try { g.setPointerCapture(e.pointerId); } catch (err) {}
  sleepScroll();
}, true);
function sleepVolg(y) {
  const { el, lijst, plek } = sleep;
  el.style.top = (y - sleep.dy) + 'px';
  const rest = [...lijst.children].filter(x => x !== el && x !== plek && x.dataset.sid);
  const voor = rest.find(x => { const r = x.getBoundingClientRect(); return y < r.top + r.height / 2; });
  // vaste regels zonder greep (zoals Overig) blijven onderaan
  lijst.insertBefore(plek, voor || [...lijst.children].find(x => x !== el && x !== plek && !x.dataset.sid) || null);
  let k = 0;
  [...lijst.children].forEach(x => { if (x === el) return; const pos = x === plek ? el.querySelector('.pos') : x.querySelector('.pos'); if (pos) pos.textContent = ++k; });
}
document.addEventListener('pointermove', e => {
  if (!sleep || e.pointerId !== sleep.id) return;
  e.preventDefault();
  sleep.y = e.clientY;
  sleepVolg(e.clientY);
});
/** Scrolt automatisch mee als je bij de boven- of onderrand van het scherm sleept. */
function sleepScroll() {
  if (!sleep) return;
  const kop = $('header.top').getBoundingClientRect().bottom;
  const y = sleep.y;
  const stap = y > innerHeight - 120 ? 10 : y < kop + 40 ? -10 : 0;
  if (stap) { $('#scroller').scrollBy(0, stap); sleepVolg(y); }
  requestAnimationFrame(sleepScroll);
}
function sleepKlaar(e) {
  if (!sleep || e.pointerId !== sleep.id) return;
  const { el, lijst, plek } = sleep;
  sleep = null;
  lijst.insertBefore(el, plek); plek.remove();
  el.classList.remove('sleept'); el.style.top = el.style.left = el.style.width = '';
  S.slepen = false;
  klikOnderdrukken = true; setTimeout(() => { klikOnderdrukken = false; }, 60);
  const ids = [...lijst.children].map(x => x.dataset.sid).filter(Boolean);
  const soort = lijst.dataset.sorteer;
  if (soort === 'route') bewaar('winkels', [{ id: S.routeWinkel, route: ids }]);
  if (soort === 'cats') bewaar('categorieen', ids.map((id, k) => ({ id, positie: k + 1 })));
  if (soort === 'rcats') bewaar('receptcategorieen', ids.map((id, k) => ({ id, positie: k + 1 })));
  // Bereidingsstappen in de bewerkmodus: alleen lokaal herschikken, opslaan gebeurt met het vinkje
  if (soort === 'stappen' && S.receptBewerk) {
    syncBewerk();

    S.receptBewerk.stappen = ids.map(k => oud[Number(k)]);
    S.rbGewijzigd = true;
    tekenBewerk();
  }
}
document.addEventListener('pointerup', sleepKlaar);

    if (!S.routeWinkel) { $('#w-route').innerHTML = '<div class="empty"><strong>Nog geen winkels</strong>Voeg eerst een winkel toe bij Winkels.</div>'; return; }

    $('#w-route').innerHTML = `<ol class="order" id="route-lijst" data-sorteer="route">${r.map((c, k) => `<li data-sid="${esc(c)}" style="--c:${kleurVan(w)}"><span class="pos">${k + 1}</span><span>${esc(catNaam(c))}</span>

    $('#w-cats').innerHTML = `<h3 class="cat"><span>Standaardvolgorde</span></h3><div class="items" data-sorteer="cats">${cats().map(c => {
      const vast = c.id === 'overig';
      return veegRij('c:' + c.id,
        `<div class="check greeprij"><div class="greeprij-hoofd"><span class="lead" style="--c:var(--primary)">${esc(c.naam.charAt(0).toUpperCase())}</span>
          <span class="pname">${esc(c.naam)}</span></div>${vast ? '<span></span>' : `<span class="greep" aria-label="${esc(c.naam)} verslepen">${GREEP_ICON}</span>`}</div>`,
        vast ? [] : [WIJZIG('cat-hernoem', c), { act: 'cat-weg', id: c.id, label: 'Verwijder', icon: PRUL_ICON, weg: true, aria: c.naam + ' verwijderen' }],
        vast ? '' : ` data-sid="${esc(c.id)}"`);
    }).join('')}</div>`;
  }

}
function naarInst(pagina) {

}

/* ================= Sheet en melding ================= */
/** Eigen bevestigvenster (werkt ook waar de browser confirm() blokkeert, zoals in de preview). */
/** soort: true of 'gevaar' = rood (verwijderen, --accent), 'ontkoppel' = rood (van een lijst halen, --ontkoppel), false = neutraal */
function bevestig(tekst, knop = 'Verwijder', gevaar = true) {
  return new Promise(klaar => {
    const w = $('#bevestig');
    w.innerHTML = `<div class="sheet-bg" data-bv="0"></div>
      <div class="bv-kaart" role="alertdialog" aria-modal="true" aria-label="${esc(tekst)}">
        <p>${esc(tekst)}</p>
        <button type="button" class="btn wide${gevaar === 'ontkoppel' ? ' ontkoppel' : gevaar ? ' gevaar' : ''}" data-bv="1">${esc(knop)}</button>
        <button type="button" class="btn soft wide" data-bv="0">Annuleer</button>
      </div>`;
    w.hidden = false;
    w.onclick = e => { const b = e.target.closest('[data-bv]'); if (!b) return; w.hidden = true; w.innerHTML = ''; klaar(b.dataset.bv === '1'); };
    $('[data-bv="1"]', w).focus();
  });
}
/** Eigen invoervenster voor een naam (in plaats van prompt()). Geeft de tekst terug, of null bij annuleren. */
function vraagTekst(titel, waarde) {
  return new Promise(klaar => {
    const w = $('#bevestig');
    w.innerHTML = `<div class="sheet-bg" data-bv="0"></div>
      <div class="bv-kaart" role="dialog" aria-modal="true" aria-label="${esc(titel)}">
        <p>${esc(titel)}</p>
        <input class="field" id="bv-invoer" value="${esc(waarde || '')}" autocomplete="off" enterkeyhint="done">
        <button type="button" class="btn wide" data-bv="1">Opslaan</button>
        <button type="button" class="btn soft wide" data-bv="0">Annuleer</button>
      </div>`;
    w.hidden = false;
    const inp = $('#bv-invoer');
    const sluit = ok => { const v = inp.value.trim(); w.hidden = true; w.innerHTML = ''; klaar(ok && v ? v : null); };
    w.onclick = e => { const b = e.target.closest('[data-bv]'); if (b) sluit(b.dataset.bv === '1'); };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); sluit(true); } };
    inp.focus(); inp.select();
  });
}
function openSheet(html) {
  const inh = $('#sheet-inhoud');
  inh.onclick = null; inh.onchange = null;
  inh.innerHTML = html;
  $('#sheet-wrap').hidden = false;
  document.body.style.overflow = 'hidden';
  const s = $('.sheet'); s.scrollTop = 0; s.focus();
}
function sluitSheet() {
  $('#sheet-wrap').hidden = true;
  document.body.style.overflow = '';
}
let toastTimer, toastActie;
function melding(tekst, knop, actie) {
  $('#toast-text').textContent = tekst;
  const b = $('#toast-btn');
  b.hidden = !knop; b.textContent = knop || '';
  toastActie = actie || null;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').classList.remove('show'); toastActie = null; }, knop ? 5000 : 3500);
}
$('#toast-btn').onclick = () => { const a = toastActie; toastActie = null; $('#toast').classList.remove('show'); if (a) a(); };

/* ================= Menu rechtsboven =================
   Staat standaard dicht. Een tik op de pil opent hem zonder van tab te wisselen.
   Hij gaat weer dicht na het kiezen van een tab, na 3 seconden niets doen, bij scrollen,
   of bij een tik op de puntjesplek. Bij het opstarten klapt hij één keer kort open. */
const menu = $('.tabs');
let menuTimer;
const menuIsOpen = () => !menu.classList.contains('ingeklapt');
function menuDicht() { clearTimeout(menuTimer); menu.classList.add('ingeklapt'); }
function menuOpen(ms = 3000) { menu.classList.remove('ingeklapt'); clearTimeout(menuTimer); menuTimer = setTimeout(menuDicht, ms); }
menu.addEventListener('click', e => {
  if (menuIsOpen() && e.target.closest('button')) { setTimeout(menuDicht, 250); return; } // tab gekozen: na het wisselen dicht
  e.preventDefault(); e.stopPropagation();                                                 // dicht: alleen openen; open: tik naast de tabs sluit
  if (menuIsOpen()) menuDicht(); else menuOpen();
}, true);
menu.addEventListener('pointermove', () => { if (menuIsOpen()) menuOpen(); }, { passive: true });
$('#scroller').addEventListener('scroll', () => { if (menuIsOpen()) menuDicht(); }, { passive: true });
setTimeout(() => menuOpen(1400), 600);

/* Formulieren zelf afhandelen: Enter of de verzendknop stuurt een eigen submit-event,
   zodat het ook werkt waar echte formulierverzending geblokkeerd is. */
function verstuur(form) { form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true })); }
document.addEventListener('click', e => {
  const b = e.target.closest('form button:not([type=button])');
  if (!b || b.disabled) return;
  e.preventDefault();
  verstuur(b.form);
});
document.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('stap-invoer') && !e.isComposing) {
    const k = Number(e.target.dataset.k);
    if (e.key === 'Enter') {
      e.preventDefault(); syncBewerk();
      S.receptBewerk.stappen.splice(k + 1, 0, ''); S.rbGewijzigd = true;
      tekenBewerk(); focusStap(k + 1); return;
    }
    if (e.key === 'Backspace' && !e.target.value && S.receptBewerk.stappen.length > 1) {
      e.preventDefault(); syncBewerk();
      S.receptBewerk.stappen.splice(k, 1); S.rbGewijzigd = true;
      tekenBewerk(); focusStap(Math.max(0, k - 1), true); return;
    }
  }
  if (e.key === 'Enter' && e.target.id === 'rb-zoek') { e.preventDefault(); const eerste = $('#rb-ac .ac-item'); if (eerste) eerste.click(); return; }
  if (e.key === 'Enter' && e.target.id === 'titel-invoer') { e.preventDefault(); e.target.blur(); return; }
  if (e.key !== 'Enter' || e.isComposing) return;
  const el = e.target;
  if (el.tagName !== 'INPUT' || !el.form) return;
  e.preventDefault();
  verstuur(el.form);
});
document.addEventListener('submit', e => {
  const id = e.target.id;
  if (id === 'add-form') { e.preventDefault(); voegToeAanLijst(); }
  if (id === 'winkel-form') {
    e.preventDefault();
    const inp = $('#winkel-invoer'), naam = inp.value.trim();
    if (!naam) return;
    if (D().winkels.some(w => w.naam.toLowerCase() === naam.toLowerCase())) return melding(`${naam} staat er al tussen.`);
    const gebruikt = D().winkels.map(w => kleurVan(w));
    const kleur = WINKELKLEUREN.find(k => !gebruikt.includes(`var(--${k})`)) || WINKELKLEUREN[D().winkels.length % WINKELKLEUREN.length];
    const w = { id: 'w' + nieuwId(), naam, kleur, positie: Math.max(0, ...D().winkels.map(x => x.positie)) + 1, route: [] };
    inp.value = '';
    sluitSheet();
    S.routeWinkel = w.id;
    bewaar('winkels', [w]);
    melding(`${naam} toegevoegd.`, 'Route instellen', () => naarInst('route'));
  }
  if (id === 'rcat-form') {
    e.preventDefault();
    const inp = $('#rcat-invoer'), naam = inp.value.trim();
    if (!naam) return;
    if (rcats().some(c => c.naam.toLowerCase() === naam.toLowerCase())) return melding(`${naam} bestaat al.`);
    inp.value = '';
    sluitSheet();
    melding(`${cap(naam)} toegevoegd.`);
    bewaar('receptcategorieen', [{ id: 'rc' + nieuwId(), naam: cap(naam), positie: Math.max(0, ...(D().receptcategorieen || []).map(c => c.positie)) + 1 }]);
  }
  if (id === 'cat-form') {
    e.preventDefault();
    const inp = $('#cat-invoer'), naam = inp.value.trim();
    if (!naam) return;
    if (D().categorieen.some(c => c.naam.toLowerCase() === naam.toLowerCase())) return melding(`${naam} bestaat al.`);
    inp.value = '';
    sluitSheet();
    melding(`${cap(naam)} toegevoegd.`);
    bewaar('categorieen', [{ id: 'c' + nieuwId(), naam: cap(naam), positie: Math.max(0, ...D().categorieen.map(c => c.positie)) + 1 }]);
  }
});

document.addEventListener('input', e => {
  if (S.receptBewerk && (e.target.closest('#recept-detail') || e.target.id === 'titel-invoer')) S.rbGewijzigd = true;
  if (e.target.id === 'rb-zoek') tekenRbAc();
  if (e.target.id === 'titel-invoer') groeiTitel();
  if (e.target.classList && e.target.classList.contains('stap-invoer')) { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }
  if (e.target.id === 'add-zoek') tekenAc();
  if (e.target.id === 'zoek-r') { S.zoekR = e.target.value; tekenRecepten(); }
  if (e.target.id === 'zoek-p') { S.zoekP = e.target.value; tekenProducten(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet-wrap').hidden) sluitSheet(); });

laad();
</script>
</body>
</html>
